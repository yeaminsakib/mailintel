[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailintel"
version = "0.1.0"
description = "Email DFIR / IOC extraction and enrichment tool"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MailIntel Team"},
]

dependencies = [
    "PyQt6>=6.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
