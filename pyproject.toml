[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailintel"
version = "0.1.0"
description = "Email DFIR / IOC extraction and enrichment tool"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "MailIntel Team"},
]

dependencies = [
    "PyQt6>=6.5",
    "PyQt6-WebEngine>=6.5",
    "PyYAML>=6.0",
    "requests>=2.31",
    "keyring>=25.0",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "pyvis>=0.3",
    "stix2>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "reportlab>=4.0",
    "matplotlib>=3.8",
]

[project.scripts]
mailintel = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "cli*"]
exclude = ["tests*", "evaluation*", "data*", "case_log*", "test_emails*", "scratch*", "Project*"]

[tool.setuptools]
# cli.py stays a run-from-source shim (python cli.py ...); the installed
# entry point uses the cli/ package, so only main.py ships as a module.
py-modules = ["main"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP017"]


[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

# PyQt6 6.12 ships a QtGui.pyi that is not valid Python ("*args, /"), so mypy
# cannot parse it.  matplotlib (used by the `evaluate` command) references Qt,
# which would drag the stub in; do not follow into PyQt6 at all.
[[tool.mypy.overrides]]
module = ["PyQt6.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

